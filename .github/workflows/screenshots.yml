name: Screenshots (development)

# Run by hand: starts the real game client on a virtual screen, runs the client game test (inventory full of the
# mod's items, a waystone and a boss) and publishes its screenshots and log to the dev-shots branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Client game test
        id: run
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          set -o pipefail
          timeout 25m xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            bash -c 'glxinfo -B || true; ./gradlew runProductionClientGameTest -PexternalDisplay --console=plain' 2>&1 | tee client.log
      - name: Publish to dev-shots
        if: always()
        run: |
          mkdir -p /tmp/out
          find . -path ./.git -prune -o -name '*.png' -path '*screenshots*' -print -exec cp {} /tmp/out/ \;
          head -n 80 client.log > /tmp/out/client-head.txt || true
          tail -n 400 client.log > /tmp/out/client-log.txt || true
          grep -n -i -E 'missing|error|exception|failed|SCREENSHOT CHECK' client.log | head -n 300 > /tmp/out/problems.txt || true
          ls -la /tmp/out
          cd /tmp/out
          git init -q -b dev-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots ${{ github.run_number }} (${{ steps.run.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-shots
