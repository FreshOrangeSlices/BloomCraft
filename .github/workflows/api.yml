name: API lookup (development)

# Run by hand while developing: lists class names matching a pattern and prints class signatures (no code) from
# the Minecraft / Fabric API classpath. The result is committed to the dev-api branch as api.txt.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: Fully qualified class names (space separated; "pkg.*" = a whole package)
        required: false
        default: ''
      search:
        description: Regex to list matching class names
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Classpath
        run: |
          chmod +x ./gradlew
          ./gradlew printClasspath --no-configuration-cache --console=plain -q > cp.txt
      - name: Look up
        env:
          CLASSES: ${{ inputs.classes }}
          SEARCH: ${{ inputs.search }}
        run: python3 .github/scripts/api.py cp.txt "$CLASSES" "$SEARCH"
      - name: Publish to dev-api
        run: |
          mkdir -p /tmp/out && cp api.txt /tmp/out/api.txt
          cd /tmp/out
          git init -q -b dev-api
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add api.txt
          git commit -q -m "API lookup ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-api
