name: API lookup (development)

# Run by hand while developing: lists class names matching a pattern and prints class signatures from the
# Minecraft / Fabric API classpath, as notice annotations.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: Fully qualified class names (space separated) to print
        required: false
        default: ''
      search:
        description: Regex to list matching class names
        required: false
        default: ''

jobs:
  lookup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Classpath
        run: |
          chmod +x ./gradlew
          ./gradlew printClasspath --no-configuration-cache --console=plain -q > cp.txt
      - name: Look up
        env:
          CLASSES: ${{ inputs.classes }}
          SEARCH: ${{ inputs.search }}
        run: python3 .github/scripts/api.py cp.txt "$CLASSES" "$SEARCH"
      - name: Report (1)
        run: python3 .github/scripts/notices.py api.txt 0
      - name: Report (2)
        run: python3 .github/scripts/notices.py api.txt 1
      - name: Report (3)
        run: python3 .github/scripts/notices.py api.txt 2
      - name: Report (4)
        run: python3 .github/scripts/notices.py api.txt 3
