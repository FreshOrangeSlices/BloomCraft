name: Build BloomCraft

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log
      # A failed build reports its errors as annotations (readable through the GitHub API)
      - name: Report errors (1)
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/annotate.py build.log 0
      - name: Report errors (2)
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/annotate.py build.log 1
      - name: Report errors (3)
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/annotate.py build.log 2
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: BloomCraft
          path: build/libs/BloomCraft.jar
